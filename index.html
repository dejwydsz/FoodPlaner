<head>

<title>Planer zakupów</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Układ: wąska kolumna do obsługi jedną ręką w sklepie, dolna nawigacja, rozwijane wiersze i arkusze edycji od dołu. */
:root{
  --bg:#F0F3EF; --surface:#FFFFFF; --ink:#14211B; --muted:#5F6F67; --line:#DAE1DB;
  --accent:#17734F; --accent-ink:#FFFFFF; --accent-soft:#DCEFE5;
  --blue:#1F4FA8; --blue-soft:#E2EAF9; --amber:#6F4F00; --amber-soft:#F8E9BC;
  --danger:#B3261E; --shadow:0 1px 2px rgba(20,33,27,.06),0 10px 28px rgba(20,33,27,.07);
  --f-d:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-b:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1512; --surface:#17211C; --ink:#E6EEE9; --muted:#90A298; --line:#2A3830;
  --accent:#4FC48F; --accent-ink:#06150E; --accent-soft:#1B3A2C;
  --blue:#9DBBF0; --blue-soft:#1B2B47; --amber:#E8C766; --amber-soft:#3A3010;
  --danger:#FF8A80; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1512; --surface:#17211C; --ink:#E6EEE9; --muted:#90A298; --line:#2A3830;
  --accent:#4FC48F; --accent-ink:#06150E; --accent-soft:#1B3A2C;
  --blue:#9DBBF0; --blue-soft:#1B2B47; --amber:#E8C766; --amber-soft:#3A3010;
  --danger:#FF8A80; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--f-b);margin:0;
  padding-block:14px 104px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto}
h1,h2,h3{font-family:var(--f-d);font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:28px;line-height:1.1}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;font-family:var(--f-b)}
h3{font-size:17px}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;max-width:100%}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:10px}
.top .sub{margin:4px 0 0;color:var(--muted)}
.prog{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 14px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.ok[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.add{display:flex;gap:8px;margin:0 0 16px}
.add input{flex:1}
.add select{width:auto;max-width:42%}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dng{color:var(--danger)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.ghost{background:transparent}

.sec{margin:18px 0 6px;display:flex;justify-content:space-between;align-items:baseline}
.sec span{color:var(--muted);font-size:13px}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.row{display:grid;grid-template-columns:44px 1fr auto;align-items:start;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.cb{width:44px;height:48px;background:none;border:0;display:grid;place-items:center;padding:0}
.cb i{width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);display:block;position:relative}
.cb[aria-pressed="true"] i{background:var(--accent);border-color:var(--accent)}
.cb[aria-pressed="true"] i::after{content:"";position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.main{padding:10px 0 10px 2px;min-width:0;cursor:pointer}
.nm{font-weight:600;overflow-wrap:anywhere}
.mt{color:var(--muted);font-size:12.5px;margin-top:2px;overflow-wrap:anywhere}
.q{padding:11px 14px 0 8px;font-weight:600;text-align:right;white-space:nowrap}
.row.done .nm,.row.done .q{text-decoration:line-through;color:var(--muted);font-weight:500}
.row.done .mt{display:none}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.tag{font-size:11.5px;font-weight:600;border-radius:6px;padding:2px 7px;background:var(--line);color:var(--muted)}
.tag.sug{background:var(--amber-soft);color:var(--amber)}
.tag.onl{background:var(--blue-soft);color:var(--blue)}
.tag.cyc{background:var(--accent-soft);color:var(--accent)}
.detail{grid-column:1/-1;padding:0 14px 12px 46px;display:flex;gap:8px;flex-wrap:wrap}
.detail .note{flex-basis:100%;color:var(--muted);font-size:13px;margin:0}
.empty{background:var(--surface);border-radius:14px;padding:22px 18px;color:var(--muted);box-shadow:var(--shadow)}
.empty b{color:var(--ink)}
.note-bar{background:var(--amber-soft);color:var(--amber);border-radius:12px;padding:10px 14px;margin:0 0 14px;font-size:14px}
.note-bar.err{background:var(--blue-soft);color:var(--blue)}

/* Tydzień */
.cov{display:grid;gap:10px;margin:0 0 14px}
.cov>div{background:var(--surface);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.cov b{display:flex;justify-content:space-between;font-weight:600}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.days i{height:8px;border-radius:4px;background:var(--line)}
.days i.on{background:var(--accent)}
.syn{border:0;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 9px;font:inherit;font-size:12px;display:inline-flex;gap:4px;align-items:center;cursor:pointer;vertical-align:middle}.syn.warn{background:var(--amber-soft);color:var(--amber)}.syn svg{width:13px;height:13px}.lsrc{margin:4px 0 0;font-size:13px}.gen{display:flex;gap:10px;align-items:center;justify-content:space-between;border-radius:14px;padding:10px 14px;margin:0 0 14px;background:var(--accent-soft);color:var(--ink)}.gen.warn{background:var(--amber-soft)}.gen b{display:flex;gap:6px;align-items:center;font-size:14px}.gen small{display:block;color:var(--muted);font-size:12px;margin-top:2px}.gen svg{width:16px;height:16px;flex:none}.gen.ok svg{color:var(--accent)}.gen.warn svg{color:var(--amber)}.days i.ex{background:#d98e2b}.days i.half{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.cov small{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
.wk{display:grid;gap:6px;margin:0 0 6px}.wkh,.wkr{display:grid;grid-template-columns:44px 1fr 1fr 1fr;gap:6px;align-items:stretch}.wk.w5 .wkh,.wk.w5 .wkr{grid-template-columns:44px repeat(4,minmax(0,1fr))}.wk.w5 .cell{font-size:12px;padding:7px 6px}.wkh span{font-size:12px;color:var(--muted);padding-left:4px}
.wkr .dn{border:0;background:none;font-weight:700;font-size:14px;color:var(--ink);border-radius:10px}.wkr.today .dn{color:var(--accent)}
.cell{border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-height:46px;text-align:left;font-size:13px;line-height:1.25;background:var(--surface);color:var(--ink);display:flex;align-items:center}
.cell.on{border-color:var(--accent);background:var(--accent-soft)}.cell.off{border-style:dashed;color:var(--muted);background:transparent}.cell i{font-style:normal;color:var(--muted)}
.cnt{margin:0 0 14px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}.cnt .dl{font-size:14px;margin-bottom:8px}.cnt .dl span{color:var(--muted);font-size:12px}.cov .cs{display:inline-flex;align-items:center;gap:4px}.cov .sb{width:30px;height:30px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);font-size:17px;line-height:1}.cov .cs .num{min-width:78px;text-align:center}
.cov .cr{display:flex;align-items:center;justify-content:space-between;margin-top:8px;font-size:13px;color:var(--muted)}.cov .cr .step .num{min-width:40px;color:var(--ink)}
.rl{list-style:none;margin:0;padding:0;max-height:46vh;overflow-y:auto;border:1px solid var(--line);border-radius:14px;-webkit-overflow-scrolling:touch}
.rl li+li{border-top:1px solid var(--line)}.ri{display:flex;align-items:center;gap:12px;width:100%;padding:8px 12px;border:0;background:none;text-align:left;color:var(--ink);font:inherit;cursor:pointer}
.ri[aria-pressed=true]{background:var(--accent-soft)}.ri .ph{width:44px;height:44px;flex:none}.ri .rt{display:flex;flex-direction:column;min-width:0;flex:1}.ri .rt b{font-weight:600;font-size:14px}.ri .rt small{color:var(--muted);font-size:12px}.ri .ck{color:var(--accent);font-weight:700}
.cq{width:100%;margin:0 0 10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit}
.startrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px;font-size:14px;color:var(--muted)}.startrow input{padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}
.wkr .dn{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}.wkr .dn small{font-weight:400;font-size:10.5px;color:var(--muted)}
.hint{font-size:12px;color:var(--muted);margin:0 0 14px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.pick{display:grid;grid-template-columns:64px 1fr;gap:12px;background:var(--surface);border-radius:14px;padding:10px;margin-bottom:10px;box-shadow:var(--shadow)}
.ph{background:var(--accent-soft);border-radius:10px;overflow:hidden;display:grid;place-items:center;font-family:var(--f-d);font-weight:700;color:var(--accent)}
.pick .ph{width:64px;height:64px}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.pick h3{font-size:16px;margin:0 0 2px}
.ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.step button{background:none;border:0;width:34px;height:34px;font-size:18px}
.step span{min-width:50px;text-align:center;font-weight:600}
.row.flash{animation:flash 2.4s ease-out}
@keyframes flash{0%,40%{background:rgba(245,158,11,.35)}100%{background:transparent}}
.tag.warn{background:rgba(245,158,11,.25);color:var(--ink)}
.qsug{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:-6px 0 14px;min-height:0}
.qsug:empty{display:none}
.qqty{flex:1;min-width:140px}
.add-list{display:flex;gap:8px;flex-wrap:wrap}

/* Przepisy */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.rc{background:var(--surface);border:0;border-radius:14px;padding:0;text-align:left;box-shadow:var(--shadow);overflow:hidden;display:block;width:100%}
.rc{position:relative}.hrt{position:absolute;top:6px;right:6px;z-index:2;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.38);color:#fff;font-size:18px;line-height:1;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}.hrt.on{color:#ff5a6e}.favrow{display:flex;align-items:center;gap:8px;margin:0 0 12px}
.rc .ph{aspect-ratio:4/3;border-radius:0;font-size:28px}
.rc .t{padding:9px 11px 11px}
.rc .t b{display:block;font-weight:600;line-height:1.25}
.rc .t span{color:var(--muted);font-size:12.5px}

/* Produkty */
.prow{display:grid;grid-template-columns:1fr auto;gap:8px;padding:11px 14px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.prow:first-child{border-top:0}
.prow .r{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav .in{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;max-width:720px;margin:0 auto}
nav button{border:0;background:none;padding:10px 4px;border-radius:10px;font-weight:600;color:var(--muted)}
nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}

/* arkusz */
#sheet:empty{display:none}
.scrim{position:fixed;inset:0;background:rgba(10,18,14,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--surface);width:100%;max-width:720px;max-height:90%;max-height:min(90dvh,calc(100dvh - 24px - env(safe-area-inset-top,0px)));overflow:auto;overscroll-behavior:contain;border-radius:18px 18px 0 0;
  padding:18px max(18px,env(safe-area-inset-right,0px)) 0 max(18px,env(safe-area-inset-left,0px))}
.panel h3{margin-bottom:12px}
.f{display:grid;gap:5px;margin:0 0 12px}
.f>label,.f>span{font-size:13px;font-weight:600;color:var(--muted)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:8px}
.seg label{position:relative;flex:1;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;font-weight:600;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked+span{color:var(--accent)}
.seg label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.chk{display:flex;gap:10px;align-items:center;font-weight:500;margin:0 0 10px}
.chk input{width:20px;height:20px;padding:0}
.sheetbar{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap;position:sticky;bottom:0;background:var(--surface);padding:12px 0 calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);z-index:2}
.ing{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.ing input{padding:8px 10px;width:72px;flex:none}
.ing small{min-width:44px}
.ing small{color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;max-width:90%;font-weight:500}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
</style>
</head>
<body>


<div class="wrap">
  <div id="msg"></div>
  <main id="view" aria-live="polite"></main>
</div>
<nav aria-label="Sekcje"><div class="in" id="nav"></div></nav>
<div id="sheet"></div>
<div id="toast"></div>

<script>
(function(){
'use strict';
var CATS=[['warz','Warzywa i owoce'],['nab','Nabiał i jajka'],['mieso','Mięso, ryby i wędliny'],['got','Gotowce (lodówka)'],['mroz','Mrożonki'],['sucho','Makarony, mąki, płatki'],['konw','Konserwy i słoiki'],['sosy','Sosy, oleje, przyprawy'],['sniad','Śniadanie, słodkie, bakalie'],['napoje','Napoje i mleka roślinne'],['dom','Chemia i dom'],['inne','Inne']];
var CATN={};CATS.forEach(function(c){CATN[c[0]]=c[1]});
var TABS=[['lista','Lista'],['tydzien','Tydzień'],['przepisy','Przepisy'],['produkty','Produkty']];
var DAYS_MAX=7;var WD=['Pn','Wt','Śr','Cz','Pt','So','Nd'];var MK2={sniadanie:'nb',obiad:'no',kolacja:'nk'},MK={sniadanie:'cs',obiad:'co',kolacja:'ck',przekaska:'cx'},MN={sniadanie:'Śniadanie',obiad:'Obiad',kolacja:'Kolacja',przekaska:'Przekąska'},POOL=function(m){return m==='sniadanie'?'sniadanie':'obiad'};function cd(m){var w=S.plan&&S.plan[MK[m]];return Array.isArray(w)?w:(m==='kolacja'||m==='przekaska'?[]:[0,1,2,3])}var BK={sniadanie:'bs',obiad:'bo',kolacja:'bk',przekaska:'bx'};function bd(m){var w=S.plan&&S.plan[BK[m]];return Array.isArray(w)?w:cd(m)}function tgt(m){return bd(m).length}function bFields(B){var o={};['sniadanie','obiad','kolacja','przekaska'].forEach(function(m){o[BK[m]]=(B[m]||[]).slice().sort(function(a,b){return a-b})});return o}function curB(){return {sniadanie:bd('sniadanie').slice(),obiad:bd('obiad').slice(),kolacja:bd('kolacja').slice(),przekaska:bd('przekaska').slice()}}
function buildSlots(picks){var s={};['sniadanie','obiad'].forEach(function(m){var cells=cd(m).slice().sort(function(a,b){return a-b}),ix=0;picks.forEach(function(pk){var r=S.recipes[pk.r];if(!r||r.meal!==m)return;for(var k=0;k<(r.days||2)&&ix<cells.length;k++)s[m+'_'+cells[ix++]]=pk.r})});return s}

function curX(){return {sniadanie:cd('sniadanie').slice(),obiad:cd('obiad').slice(),kolacja:cd('kolacja').slice(),przekaska:cd('przekaska').slice()}}

function clearTrail(sl,m,d){var id=sl[m+'_'+d];if(!id)return;var o=tmeals((S.recipes[id]||{}).meal);for(var e=d+1;e<7;e++){var f=null;for(var k=0;k<o.length;k++)if(sl[o[k]+'_'+e]===id){f=o[k];break}if(!f)break;delete sl[f+'_'+e]}}
function place(sl,rid,sm,X){X=X||curX();var r=S.recipes[rid],n=r.days||2,need=r.ready?1:Math.min(n,2),fr=function(m,d){return X[m].indexOf(d)>=0&&!sl[m+'_'+d]};
  var m0=r.meal==='sniadanie'?'sniadanie':r.meal==='kolacja'?'kolacja':r.meal==='przekaska'?'przekaska':'obiad',st=null,o=tmeals(r.ready?'ready':r.meal);

function write(path,fn){
  if(!DB)return Promise.resolve();
  var prev=queues[path]||Promise.resolve();
  var next=prev.catch(function(){}).then(function(){return fn(DB.doc(path))});
  queues[path]=next;
  return next.catch(function(e){
    toast(e&&e.code==='invalid_argument'?'Brak uprawnień do zapisu. Poproś właściciela o dostęp do edycji.':'Nie udało się zapisać: '+((e&&e.message)||e));
  });
}

function setDoc(path,data){return write(path,function(r){return r.set(data)})}

function normPk(a){return (a||[]).map(function(p){return {r:p.r,m:p.m||1,sug:!!p.sug}}).sort(function(x,y){return x.r<y.r?-1:x.r>y.r?1:0})}

function bulkTxt(n,u){
  if(u==='g')return n>=1000?'ok. '+fmt(Math.ceil(n/500)/2)+' kg':'ok. '+Math.ceil(n/50)*50+' g';
  if(u==='ml')return n>=1000?'ok. '+fmt(Math.ceil(n/500)/2)+' l':'ok. '+Math.ceil(n/50)*50+' ml';
  return 'ok. '+fmt(Math.ceil(n))+' '+u;
}
function compute(){
  var P=S.products,R=S.recipes,pl=S.plan,st=pl.state||{},td=today(),items={};
  function get(k,init){return items[k]||(items[k]=Object.assign({key:k,need:0,srcs:[],sugFor:[],hasReg:false,cyc:false},init))}
  listPk().forEach(function(pk){
    var r=R[pk.r];if(!r)return;
    (r.ing||[]).forEach(function(g){
      var p=P[g.p];if(!p||p.del)return;
      if(g.sug&&!pk.sug)return;
      var it=get('p_'+g.p,{p:g.p});
      it.need+=(g.q||0)*(pk.m||1);
      if(it.srcs.indexOf(r.t)<0)it.srcs.push(r.t);
      if(g.sug){if(it.sugFor.indexOf(r.t)<0)it.sugFor.push(r.t)}else it.hasReg=true;
    });
  });
  var xlink={};
  Object.keys(pl.extras||{}).forEach(function(id){
    var x=pl.extras[id];if(!x||x.del||!x.p)return;var p=P[x.p];if(!p||p.del)return;
    var it=get('p_'+x.p,{p:x.p});xlink[id]=1;
    it.xid=id;it.hasReg=true;
    if(it.srcs.indexOf('ręcznie')<0)it.srcs.push('ręcznie');
    var q=parseFloat(String(x.xq==null?'':x.xq).replace(',','.'));
    if(q>0){it.need+=q;it.xqty=q}else it.xnoq=true;
  });
  Object.keys(P).forEach(function(id){
    var p=P[id];if(p.del)return;var c=p.cycle;if(!c||!c.on)return;
    var k='p_'+id;
    var due=c.force||((!c.last||dayDiff(c.last,td)>=(c.every||7))&&(!c.snooze||td>=c.snooze));
    if(due||st[k]==='got'){var it=get(k,{p:id});it.cyc=true;it.hasReg=true;it.cycPacks=c.packs||1}
  });
  var out=[];
  Object.keys(items).forEach(function(k){
    var it=items[k],p=P[it.p];
    var packs=p.flat?1:Math.max(1,Math.ceil(it.need/(p.pk||1)-1e-6));
    if(it.cyc)packs=(it.need>0&&!p.flat)?Math.max(packs,it.cycPacks):it.cycPacks;
    var qty=(!p.pkl||p.pkl==='szt.')?packs+' szt.':packs+' × '+p.pkl;
    var needTxt='';
    if(!p.flat&&it.need>0&&!(p.u==='szt.'&&p.pk===1)){needTxt='potrzeba ok. '+fmt(it.need)+' '+p.u}
    if(p.bulk&&!p.flat){qty=it.need>0?bulkTxt(it.need,p.u):'na wagę';needTxt=''}
    var planNeed=it.need-(it.xqty||0);
    out.push({key:k,p:it.p,name:p.n,cat:p.c||'inne',pl:p.pl||'s',qty:qty,need:needTxt,srcs:it.srcs,u:p.u,xid:it.xid,xqty:it.xqty,
      warn:!!(it.xnoq&&!p.flat&&planNeed>0),
      sugOnly:!it.hasReg&&it.sugFor.length>0,sugFor:it.sugFor,cyc:it.cyc,sub:p.sub||'',status:st[k]||(p.home?'have':'buy')});
  });
  Object.keys(pl.extras||{}).forEach(function(id){
    var x=pl.extras[id];if(!x||x.del||xlink[id])return;var k='x_'+id;
    out.push({key:k,x:true,id:id,name:x.n,cat:x.c||'inne',pl:x.pl||'s',qty:x.q||'',need:'',srcs:[],sugFor:[],cyc:false,sub:'',status:st[k]||'buy'});
  });
  return out;
}

function checkList(){
  var P=S.products,td=today(),st=(S.plan.state||{}),out=[];
  Object.keys(P).forEach(function(id){
    var p=P[id],c=p.cycle;if(p.del||!c||!c.on||!c.last||c.force||st['p_'+id])return;
    var ev=c.every||7,el=dayDiff(c.last,td),fr=el/ev;
    if(fr>=1)return;
    if(!S.chkAll&&(fr<0.5||(c.chk&&td<c.chk)))return;
    out.push({id:id,n:p.n,el:el,ev:ev,fr:fr});
  });
  return out.sort(function(a,b){return b.fr-a.fr});
}

function nrm(s){return String(s||'').toLowerCase().replace(/ł/g,'l').normalize('NFD').replace(/[̀-ͯ]/g,'')}
function qlists(){return Object.keys(S.ql).filter(function(id){return !S.ql[id].del}).sort(function(a,b){return (S.ql[a].t||0)-(S.ql[b].t||0)})}
function qitems(lid){var it=S.qi;return Object.keys(it).filter(function(k){return !it[k].del&&it[k].l===lid}).map(function(k){return Object.assign({id:k},it[k])})}
function qcurId(){var ids=qlists();if(!S.qcur||ids.indexOf(S.qcur)<0)S.qcur=ids[0]||null;return S.qcur}
function qaddgo(){var i=$('#qn');if(!i)return;S.qq=i.value;var tp=qmatch()[0];if(tp&&tp.sc===0){qadd('',tp.id);toast('Dodano: '+tp.n)}else qadd(S.qq,'');render(true);setTimeout(function(){var x=$('#qn');if(x)x.focus()},0)}
function qnlsave(){
  var i=$('#qnl');if(!i)return;var nm=i.value.trim();if(!nm){toast('Wpisz nazwę listy');return}
  var id=Math.random().toString(36).slice(2,9),o={};o[id]={n:nm,t:Date.now()};
  S.ql[id]={n:nm,t:o[id].t};S.qcur=id;S.qnew=false;S.qq='';qsave({lists:o});render(true);
  setTimeout(function(){var x=$('#qn');if(x)x.focus()},0);
}
function xmatch(){
  var q=nrm(S.xq).trim();if(!q)return [];
  var ex=S.plan.extras||{},have={};Object.keys(ex).forEach(function(k){if(!ex[k].del&&ex[k].p)have[ex[k].p]=1});
  var m=[];
  Object.keys(S.products).forEach(function(id){
    var p=S.products[id];if(p.del||have[id])return;
    var n=nrm(p.n),ix=n.indexOf(q);if(ix<0)return;
    m.push({id:id,n:p.n,sc:ix===0?0:(n.charAt(ix-1)===' '?1:2)});
  });
  return m.sort(function(a,b){return a.sc-b.sc||a.n.length-b.n.length||a.n.localeCompare(b.n,'pl')});
}
function xsug(){
  if(!nrm(S.xq).trim())return '';
  return xmatch().slice(0,8).map(function(x){return '<button type="button" class="chip" data-act="xpick" data-p="'+x.id+'">'+esc(x.n)+'</button>'}).join('')+'<button type="button" class="chip" data-act="xnewprod">+ Nowy produkt: '+esc(S.xq.trim())+'</button>';
}
function flashRow(key,tries){

  var el=document.querySelector('#view [data-key="'+key+'"]'),li=el&&el.closest('li');
  if(li){li.classList.add('flash');li.scrollIntoView({block:'center',behavior:'smooth'});return}
  if(tries>0)setTimeout(function(){flashRow(key,tries-1)},150);
}
function xaddp(id){

function qput(lid,iid,f){S.qi[iid]=Object.assign({},S.qi[iid]||{l:lid},f);var o={};o[iid]=Object.assign({l:lid},f);return qsave({items:o})}
function qadd(name,p){
  var lid=qcurId();if(!lid)return;name=String(name||'').trim();
  if(p&&S.products[p])name=S.products[p].n;
  if(!name)return;
  if(!p){var nn=nrm(name);Object.keys(S.products).forEach(function(id){var x=S.products[id];if(!p&&!x.del&&nrm(x.n)===nn)p=id})}
  var pr=p?S.products[p]:null;
  var ex=qitems(lid).filter(function(i){return p?i.p===p:nrm(i.n)===nrm(name)})[0];
  if(ex){toast('Już jest na liście: '+ex.n);return}
  qput(lid,Math.random().toString(36).slice(2,9),{n:pr?pr.n:name,p:p||'',c:pr?(pr.c||'inne'):'inne',d:false});
  S.qq='';
}
function qmatch(){
  var lid=qcurId(),q=nrm(S.qq).trim();if(!lid||!q)return [];
  var have={};qitems(lid).forEach(function(i){if(i.p)have[i.p]=1});
  var m=[];
  Object.keys(S.products).forEach(function(id){
    var p=S.products[id];if(p.del||have[id])return;
    var n=nrm(p.n),ix=n.indexOf(q);if(ix<0)return;
    m.push({id:id,n:p.n,sc:ix===0?0:(n.charAt(ix-1)===' '?1:2)});

  return m.sort(function(a,b){return a.sc-b.sc||a.n.length-b.n.length||a.n.localeCompare(b.n,'pl')});
}

function setStatus(key,val,extra){
  var o={};o[key]=val;
  var jobs=[plan({state:o})];
  if(key.indexOf('p_')===0){var id=key.slice(2),p=S.products[id];
    if(p&&p.cycle&&p.cycle.on){
      if(val==='got')jobs.push(prod(id,{cycle:{last:today(),prevLast:p.cycle.last||null,snooze:null,force:false,chk:null}}));
      else if(extra==='undo')jobs.push(prod(id,{cycle:{last:p.cycle.prevLast||null}}));
      else if(val==='have')jobs.push(prod(id,{cycle:{snooze:addDays(today(),7)}}));
      else if(val==='buy')jobs.push(prod(id,{cycle:{snooze:null}}));
    }}
  return Promise.all(jobs);
}
function propose(){
  var rs=Object.keys(S.recipes).map(function(id){return Object.assign({id:id},S.recipes[id])});
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  var st0=startStr();
  function recent(r){if(!S.norep||!r.last)return 0;var dd=dayDiff(r.last,st0);return dd>=1&&dd<=7?1:0}
  function sorted(meal){return rs.filter(function(r){return r.meal===meal}).map(function(r){return {r:r,k:Math.pow(Math.random(),1/(r.fav?3:1))}}).sort(function(a,b){return (recent(a.r)-recent(b.r))||(b.k-a.k)}).map(function(x){return x.r})}
  var B0=curB(),sl={},X={sniadanie:B0.sniadanie.slice(),obiad:B0.obiad.slice(),kolacja:B0.kolacja.slice(),przekaska:B0.przekaska.slice()},used={},pools={obiad:sorted('obiad'),kolacja:sorted('kolacja'),sniadanie:sorted('sniadanie'),przekaska:sorted('przekaska')},cur={obiad:0,kolacja:0,sniadanie:0,przekaska:0};
  function run(startMeal,N){
    var pool=pools[startMeal],key=startMeal,cnt=0;
    if(!pool.length)return;
    while(cnt<N&&cnt<30){var t=0,ok=0;while(!ok&&t<pool.length){var r=pool[cur[key]++%pool.length];t++;if(used[r.id])continue;ok=place(sl,r.id,startMeal,X);if(ok)used[r.id]=1}if(!ok)break;cnt++}
  }
  run('obiad',Infinity);run('kolacja',Infinity);run('sniadanie',Infinity);run('przekaska',Infinity);
  var td=today();
  plan(Object.assign({slots:JSON.stringify(sl),picks:derive(sl,[]),example:false,start:startStr()},xFields(X),bFields(B0)));
}

  /* ---- źródło nawigacji ---- */
  var src=null,vt=document.getElementById('viewTabs');
  function labelOf(b){var c=b.cloneNode(true);c.querySelectorAll('.badge').forEach(function(x){x.remove()});return c.textContent.trim()}
  function mk(b,active,badge){var l=labelOf(b),k=BYLABEL[l.toLowerCase()];return {label:l,short:k?k[1]:l,icon:k?k[0]:'dash',active:active,badge:badge||0}}
  if(vt){
    src={box:vt,items:function(){return [].map.call(vt.querySelectorAll('.tab[data-view]'),function(b){var v=b.dataset.view,l=b.textContent.trim();return {label:l,short:SHORT[v]||l,icon:ICO[v]||'dash',active:b.classList.contains('active'),badge:0,click:function(){b.click()}}})},watch:{attributes:true,attributeFilter:['class'],subtree:true}};
  }else if(document.getElementById('tabs')&&document.querySelector('#tabs, [role=tablist]')&&/tab/.test(document.getElementById('tabs').getAttribute('role')||'tablist')){
    var tb=document.getElementById('tabs');
    src={box:tb,items:function(){return [].map.call(tb.querySelectorAll('[role=tab]'),function(b){var bd=b.querySelector('.badge'),n=bd?parseInt(bd.textContent,10)||0:0,it=mk(b,b.getAttribute('aria-selected')==='true',n);it.attrs=Object.assign({},b.dataset);it.native=true;return it})},watch:{childList:true,attributes:true,subtree:true,characterData:true}};
  }else if(document.getElementById('nav')&&document.querySelector('#nav button[data-act=tab]')||document.getElementById('nav')){
    var nv=document.getElementById('nav');
    src={box:nv,items:function(){return [].map.call(nv.querySelectorAll('button'),function(b){var it=mk(b,b.getAttribute('aria-current')==='page');it.attrs=Object.assign({},b.dataset);it.native=true;return it})},watch:{childList:true,attributes:true,subtree:true}};
  }else{
    var secs=[['Założenia','plan','#hZal',1],['Wyniki','dash','#kpis',0],['Scenariusze','layers','#hScen',1],['Wykres','chart','#chartCard',0],['Konta','wallet','#hKonta',1]];
    var cur=0;
    src={box:null,items:function(){return secs.map(function(s,i){return {label:s[0],short:s[0],icon:s[1],active:i===cur,badge:0,click:function(){var el=document.querySelector(s[2]);var t=el&&s[3]?(el.closest('section')||el):el;if(t){t.style.scrollMarginTop='16px';t.scrollIntoView({behavior:'smooth',block:'start'});cur=i;sync()}}}})}};
  }
  /* ---- elementy ---- */
  var side=document.createElement('div');side.className='ui-shell ui-side';
  var bar=document.createElement('div');bar.className='ui-shell ui-bar';bar.setAttribute('role','navigation');bar.setAttribute('aria-label','Nawigacja');
  var nav=document.createElement('div');nav.className='ui-nav';
  var dh='';
  [['o','Osobiste'],['w','Praca']].forEach(function(gr){
    if(!DASH.some(function(d){return d.g===gr[0]}))return;
    dh+='<div class="ui-sub">'+gr[1]+'</div>';
    DASH.filter(function(d){return d.g===gr[0]}).forEach(function(d){var c=title.indexOf(d.n)===0;dh+=(c?'<span class="ui-item cur" aria-current="page">':'<a class="ui-item" target="_blank" rel="noopener" href="'+d.u+'">')+svg(d.i)+'<span>'+esc(d.n)+'</span>'+(c?'</span>':'</a>')});
  });
  var brandIcon=(DASH.filter(function(d){return title.indexOf(d.n)===0})[0]||{i:'ret'}).i;
  side.innerHTML='<div class="ui-brand"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+(I[brandIcon]||I.ret)+'</svg></i><span>'+esc(title)+'</span></div>';
  side.appendChild(nav);side.insertAdjacentHTML('beforeend',dh);
  [side,bar].forEach(function(e){document.body.appendChild(e)});
  /* przełącznik motywu, gdy strona go nie ma */
  if(!document.getElementById('themeTg')){
    var tg=document.createElement('button');tg.type='button';tg.className='theme-tg';tg.id='themeTg';tg.setAttribute('aria-label','Przełącz tryb jasny / ciemny');tg.title='Przełącz tryb jasny / ciemny';
    tg.innerHTML='<svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
    tg.addEventListener('click',function(){
      var a=R.getAttribute('data-theme'),e=(a==='light'||a==='dark')?a:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'),n=e==='dark'?'light':'dark';
      R.setAttribute('data-theme',n);try{localStorage.setItem('theme',n)}catch(x){}
      try{document.dispatchEvent(new CustomEvent('themechange',{detail:n}))}catch(x){}
    });
    document.body.appendChild(tg);
  }
  /* ---- synchronizacja ---- */
  var lastKey='',items=[];
  function sync(){
    items=src.items();
    var key=items.map(function(it){return it.label+'|'+it.badge}).join('~');
    if(key!==lastKey){
      lastKey=key;
      nav.innerHTML=items.map(function(it,i){return '<button type="button" class="ui-item"'+at(it)+' data-i="'+i+'">'+svg(it.icon)+'<span>'+esc(it.label)+'</span>'+(it.badge?'<em class="ui-badge">'+it.badge+'</em>':'')+'</button>'}).join('');
      bar.innerHTML=items.map(function(it,i){return '<button type="button" class="ui-tab"'+at(it)+' data-i="'+i+'">'+svg(it.icon)+'<span>'+esc(it.short)+'</span>'+(it.badge?'<i class="ui-dot"></i>':'')+'</button>'}).join('');
    }
    var k=items.findIndex(function(it){return it.active});if(k<0)k=0;
    document.querySelectorAll('.ui-item[data-i],.ui-tab[data-i]').forEach(function(e){var on=+e.dataset.i===k;e.classList.toggle('on',on);if(on)e.setAttribute('aria-current','page');else e.removeAttribute('aria-current')});
  }
  function onClick(e){var b=e.target.closest('[data-i]');if(!b)return;var it=items[+b.dataset.i];if(it&&it.native){window.scrollTo({top:0,behavior:'smooth'});setTimeout(sync,60);return}if(it&&it.click){it.click();if(src.box)window.scrollTo({top:0,behavior:'smooth'});setTimeout(sync,0)}}
  side.addEventListener('click',onClick);bar.addEventListener('click',onClick);
  if(src.box){new MutationObserver(sync).observe(src.box,src.watch)}
  else{
    var tk=0;
    addEventListener('scroll',function(){if(tk)return;tk=requestAnimationFrame(function(){tk=0;var best=0;[['#hZal',1],['#kpis',0],['#hScen',1],['#chartCard',0],['#hKonta',1]].forEach(function(s,i){var el=document.querySelector(s[0]),t=el&&s[1]?(el.closest('section')||el):el;if(t&&t.getClientRects().length&&t.getBoundingClientRect().top<=140)best=i});if(best!==src._cur){src._cur=best;sync()}})},{passive:true});
  }
  sync();
})();

</script>
<!--UI-SHELL:END-->
<script>if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
